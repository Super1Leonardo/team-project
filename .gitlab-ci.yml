# This file is auto-generated by DevPlatform for further customizing as you wish.
# NOTE: You should not delete this file!

stages:
  - test
  - deploy

default:
  interruptible: true

variables:
  GIT_STRATEGY: fetch
  REMOTE_APP_UP_CMD: docker compose up -d --build --remove-orphans
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"

backend_tests:
  stage: test
  image: python:3.12
  cache:
    key: backend-pip-cache
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt pytest coverage
  script:
    - python -m coverage run -m pytest backend/tests --junitxml=backend-junit.xml -q
    - python -m coverage report --include="backend/app/*"
    - python -m coverage xml -o backend-coverage.xml --include="backend/app/*"
  coverage: '/TOTAL.+?(\d+(?:\.\d+)?%)$/'
  artifacts:
    when: always
    reports:
      junit: backend-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: backend-coverage.xml
    paths:
      - backend-junit.xml
      - backend-coverage.xml

frontend_e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.58.2-jammy
  cache:
    key: frontend-npm-cache
    paths:
      - .cache/npm
  script:
    - cd web
    - npm install
    - PLAYWRIGHT_JUNIT_OUTPUT_NAME=playwright-junit.xml npx playwright test --reporter=line,junit --output=test-results
  artifacts:
    when: always
    reports:
      junit: web/playwright-junit.xml
    paths:
      - web/playwright-junit.xml
      - web/test-results
      - web/playwright-report

.deploy_template:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      set -eu

      if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
        echo "SSH_PRIVATE_KEY is not set." >&2
        exit 1
      fi

      key_file="$HOME/.ssh/gitlab_deploy_key"

      cp "$SSH_PRIVATE_KEY" "$key_file"
      tr -d '\r' < "$key_file" > "$key_file.tmp"
      mv "$key_file.tmp" "$key_file"
      chmod 600 "$key_file"

      ssh-keygen -y -f "$key_file" >/dev/null
      ssh-add "$key_file"
    - |
      if [ -f "${SSH_KNOWN_HOSTS:-}" ]; then
        cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
      else
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      fi
    - chmod 644 ~/.ssh/known_hosts
  script:
    - sh scripts/deploy_remote.sh

deploy_branch:
  extends: .deploy_template
  variables:
    DEPLOY_TARGET_DIR: "${DEPLOY_BASE_PATH}/${CI_COMMIT_REF_SLUG}"
  environment:
    name: review/${CI_COMMIT_REF_SLUG}
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: manual
    - when: never

deploy_production:
  extends: .deploy_template
  variables:
    DEPLOY_TARGET_DIR: "${DEPLOY_BASE_PATH}/production"
    REMOTE_APP_UP_CMD: docker compose --profile python --profile prod build --build-arg CACHE_BUST=$CI_COMMIT_SHORT_SHA && docker compose --profile python --profile prod up -d --build --pull always --remove-orphans
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
