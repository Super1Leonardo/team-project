# This file is auto-generated by DevPlatform for further customizing as you wish.
# NOTE: You should not delete this file!

stages:
  - test
  - deploy

default:
  interruptible: true

variables:
  GIT_STRATEGY: fetch
  REMOTE_APP_UP_CMD: docker compose --profile python up -d --build --remove-orphans

test:
  stage: test
  script:
    - echo "ok"

.deploy_template:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - chmod 600 ~/.ssh
    - |
      if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
        echo "SSH_PRIVATE_KEY is not set." >&2
        exit 1
      fi
      key_file="$HOME/.ssh/gitlab_deploy_key"
      raw_key_file="$HOME/.ssh/gitlab_deploy_key.raw"
      if [ -f "${SSH_PRIVATE_KEY:-}" ]; then
        tr -d '\r' < "$SSH_PRIVATE_KEY" > "$raw_key_file"
      else
        printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$raw_key_file"
      fi

      if grep -q "BEGIN .* PRIVATE KEY" "$raw_key_file"; then
        cp "$raw_key_file" "$key_file"
      elif printf '%b' "$(cat "$raw_key_file")" | grep -q "BEGIN .* PRIVATE KEY"; then
        printf '%b' "$(cat "$raw_key_file")" > "$key_file"
      elif base64 -d "$raw_key_file" > "$key_file" 2>/dev/null && grep -q "BEGIN .* PRIVATE KEY" "$key_file"; then
        :
      else
        echo "SSH_PRIVATE_KEY is not in a supported format." >&2
        echo "Use one of these formats: GitLab File variable, plain private key text, or base64-encoded private key." >&2
        exit 1
      fi

      chmod 600 "$key_file"
      echo "key_file stats:"
      ls -l "$key_file"
      echo "line count:"
      wc -l "$key_file"
      echo "byte count:"
      wc -c "$key_file"
      echo "begin marker:"
      grep -n "^-----BEGIN .* PRIVATE KEY-----$" "$key_file" || true
      echo "end marker:"
      grep -n "^-----END .* PRIVATE KEY-----$" "$key_file" || true
      echo "first line:"
      head -n 1 "$key_file"
      echo "last line:"
      tail -n 1 "$key_file"

      if ! ssh-keygen -y -f "$key_file" >/dev/null 2>&1; then
        echo "SSH_PRIVATE_KEY is invalid or passphrase-protected. Use an unencrypted deploy key in OpenSSH/PEM format." >&2
        exit 1
      fi
      ssh-add "$key_file"
    - |
      if [ -f "${SSH_KNOWN_HOSTS:-}" ]; then
        cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
      else
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      fi
    - chmod 644 ~/.ssh/known_hosts
  script:
    - sh scripts/deploy_remote.sh

deploy_branch:
  extends: .deploy_template
  variables:
    DEPLOY_TARGET_DIR: "${DEPLOY_BASE_PATH}/${CI_COMMIT_REF_SLUG}"
  environment:
    name: review/${CI_COMMIT_REF_SLUG}
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: manual
    - when: never

deploy_production:
  extends: .deploy_template
  variables:
    DEPLOY_TARGET_DIR: "${DEPLOY_BASE_PATH}/production"
    REMOTE_APP_UP_CMD: docker compose --profile python --profile prod up -d --build --remove-orphans
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
