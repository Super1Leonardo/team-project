services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: runner
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      PUBLIC_BACKEND_API_URL: ${PUBLIC_BACKEND_API_URL:-http://localhost:8000}

  web-prod:
    profiles: ["prod"]
    build:
      context: ./web
      dockerfile: Dockerfile
      target: runner
    ports:
      - "${WEB_PROD_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      PUBLIC_BACKEND_API_URL: ${PUBLIC_BACKEND_API_URL:-http://localhost:8000}

  e2e:
    profiles: ["e2e"]
    build:
      context: ./web
      dockerfile: Dockerfile
      target: playwright
    working_dir: /app
    environment:
      CI: "1"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - bun_cache:/root/.bun/install/cache
    command: sh -c "bun install --frozen-lockfile && bun run test:e2e"

  python:
    profiles: ["python"]
    build:
      context: .
      dockerfile: Dockerfile.python
    working_dir: /app
    ports:
      - "${PYTHON_PORT:-8000}:8000"
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      TELEGRAM_SESSION_PATH: /app/backend/data/telegram_parser
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      PUBLIC_BACKEND_API_URL: ${PUBLIC_BACKEND_API_URL:-http://localhost:8000}
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

volumes:
  web_node_modules:
  bun_cache:
  pip_cache:
