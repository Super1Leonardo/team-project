services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: runner
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}

  web-prod:
    profiles: ["prod"]
    build:
      context: ./web
      dockerfile: Dockerfile
      target: runner
    ports:
      - "${WEB_PROD_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}

  e2e:
    profiles: ["e2e"]
    build:
      context: ./web
      dockerfile: Dockerfile
      target: playwright
    working_dir: /app
    environment:
      CI: "1"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - bun_cache:/root/.bun/install/cache
    command: sh -c "bun install --frozen-lockfile && bun run test:e2e"

  python:
    profiles: ["python"]
    build:
      context: .
      dockerfile: Dockerfile.python
    working_dir: /app
    ports:
      - "${PYTHON_PORT:-8000}:8000"
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip
    command: sh -c "if [ -s requirements.txt ]; then pip install -r requirements.txt; fi && python -m http.server 8000"

volumes:
  web_node_modules:
  bun_cache:
  pip_cache:
